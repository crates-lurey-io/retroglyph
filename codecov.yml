codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  core:
    paths:
      - crates/core/src/
    carryforward: true
  terminal:
    paths:
      - crates/terminal/src/
    carryforward: true
  crossterm:
    paths:
      - crates/crossterm/src/
    carryforward: true
  terminal-wasm:
    paths:
      - crates/terminal-wasm/src/
    carryforward: true
  software:
    paths:
      - crates/software/src/
    carryforward: true
  gl:
    paths:
      - crates/gl/src/
    carryforward: true
  window:
    paths:
      - crates/window/src/
    carryforward: true
  widgets:
    paths:
      - crates/widgets/src/
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        informational: true
      - type: patch
        informational: true
  individual_components:
    - component_id: core
      name: core
      flag_regexes:
        - ^core$
    - component_id: terminal
      name: terminal
      flag_regexes:
        - ^terminal$
    - component_id: crossterm
      name: crossterm
      flag_regexes:
        - ^crossterm$
    - component_id: terminal-wasm
      name: terminal-wasm
      flag_regexes:
        - ^terminal-wasm$
    - component_id: software
      name: software
      flag_regexes:
        - ^software$
    - component_id: gl
      name: gl
      flag_regexes:
        - ^gl$
    - component_id: window
      name: window
      flag_regexes:
        - ^window$
    - component_id: widgets
      name: widgets
      flag_regexes:
        - ^widgets$

github_checks:
  annotations: false

ignore:
  - 'crates/*/benches/**'
  - 'examples/**'
  - 'tools/**'
  - '**/build.rs'

comment:
  layout: condensed_header, condensed_files, condensed_footer
  behavior: default
  require_changes: true
