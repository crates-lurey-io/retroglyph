name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Feeds test-wasm's `if:` below: crates/terminal-wasm's own tree, the two crates it depends
  # on (core, terminal), and the workspace-wide files that affect how it's built/tested --
  # Cargo.toml (pins wasm-pack/wasm-bindgen-cli versions in [workspace.metadata.bin] and default
  # wasm-bindgen resolution), Cargo.lock, .cargo/config.toml, the Justfile recipe itself, and this
  # workflow file. Every other job stays unconditional.
  changes:
    runs-on: ubuntu-latest
    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wasm:
              - 'crates/core/**'
              - 'crates/terminal/**'
              - 'crates/terminal-wasm/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'Justfile'
              - '.github/workflows/ci.yml'

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: npm ci --prefix tools
      - run: just rustfmt
      - run: just prettier

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install vale
        run: |
          curl -sL https://github.com/errata-ai/vale/releases/download/v3.17.0/vale_3.17.0_Linux_64-bit.tar.gz | tar xz -C /usr/local/bin vale
      - run: npm ci --prefix tools
      - run: just clippy
      - run: just markdown
      - run: just prose
      - run: just deny-advisories
        continue-on-error: true
      - run: just deny-licenses

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: cargo-bins/cargo-binstall@v1.13.0
      - run: cargo binstall cargo-llms-txt --no-confirm -q
      - run: just doc

  compile:
    name: compile ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, 1.88]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just compile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      - run: just test-ci
      # Powers https://app.codecov.io/gh/crates-lurey-io/retroglyph/tests (flaky-test detection,
      # failure rate, run time trends). Reads the JUnit XML the `ci` nextest profile writes to
      # `target/nextest/ci/junit.xml` (see .config/nextest.toml). Runs even if `just test-ci`
      # failed above (`!cancelled()`, not just `always()`, so a *cancelled* run still skips it) --
      # failed runs are exactly the ones Test Analytics most wants to see.
      #
      # Split first, into one file per crate flag: Codecov's `flags` filter on the Tests dashboard
      # is set per *upload*, not per `<testsuite>` inside one upload, so a single combined-
      # workspace upload can carry at most one flag without misattributing every crate's tests to
      # every other crate's flag (see tools/split-junit-flags.py's docstring, and Codecov's own
      # Flags docs, which warn about exactly this for coverage uploads -- same limitation here).
      - name: Split JUnit report by crate flag
        if: ${{ !cancelled() }}
        run: python3 tools/split-junit-flags.py target/nextest/ci/junit.xml target/nextest/ci/flags
      # One upload per crate flag (codecov/codecov-action, same action as the `coverage` job below,
      # with `report_type: test_results` -- not the separate codecov/test-results-action: that
      # action's own README says it's being deprecated in favor of this, and its highest published
      # tag is `v1` -- the `v5` tag some Codecov docs reference for it doesn't exist). `unflagged`
      # is the examples crate's snapshot tests, which exercise several backend crates at once and
      # don't map to a single crate flag, so it uploads with no `flags` input.
      #
      # `disable_search: true` on every one of these is load-bearing, not cosmetic: the Codecov CLI
      # auto-discovers any `*junit.xml` on disk in addition to `files:`, and the pre-split
      # `target/nextest/ci/junit.xml` (all 669 tests) still sits right next to the split files it
      # came from. Without this, every flag below would silently re-upload that combined file too,
      # tagging every crate's tests with every other crate's flag -- exactly the bug this split was
      # meant to avoid.
      - name: Upload test results to Codecov (core)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/flags/core.xml
          flags: core
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (terminal)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/flags/terminal.xml
          flags: terminal
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (crossterm)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/flags/crossterm.xml
          flags: crossterm
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (terminal-wasm)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/flags/terminal-wasm.xml
          flags: terminal-wasm
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (software)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/flags/software.xml
          flags: software
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (gl)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/flags/gl.xml
          flags: gl
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (wgpu)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/flags/wgpu.xml
          flags: wgpu
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (window)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/flags/window.xml
          flags: window
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (widgets)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/flags/widgets.xml
          flags: widgets
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov (unflagged)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/flags/unflagged.xml
          report_type: test_results
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Build-only check that the GL backend's WebGL2 path compiles for wasm32. This is the fast
  # signal; the live browser run below (test-wasm-gl) actually executes a WebGL2 frame. Kept as a
  # separate quick job so a plain compile break is reported without waiting on the browser harness.
  compile-wasm-gl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run:
          cargo check -p retroglyph-gl --target wasm32-unknown-unknown --features
          default-font,tilesets

  # Live headless-Chrome WebGL2 render smoke test (issue #370): the browser sibling of the native
  # gl-headless job. It runs crates/gl/src/webgl_smoke.rs (a `wasm-bindgen-test`) through
  # `wasm-pack test --headless --chrome`, which builds the crate for wasm32, drives a real WebGL2
  # context, renders a frame, and reads the pixels back -- so a backend that compiles but renders
  # nothing (the glow 0.16 texImage3D atlas-upload bug) fails here instead of shipping green. CI
  # runners have no GPU, so crates/gl/webdriver.json launches Chrome with `--enable-unsafe-swiftshader`
  # for a software WebGL2 stack. The WebDriver session fails to start if chromedriver and Chrome
  # differ by a major version, so this uses the ubuntu-latest image's *preinstalled, matched*
  # google-chrome + chromedriver pair (chromedriver dir in $CHROMEWEBDRIVER) rather than installing
  # a separate one -- browser-actions/setup-chrome's "stable" resolves Chrome and chromedriver to
  # different majors (150 vs 151 as of this writing), which is exactly that failure.
  test-wasm-gl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Same cargo-run-bin provisioning as the test-wasm job: cargo-binstall on PATH as a fast
      # fallback, and caching ./.bin so a warm cache skips the wasm-pack/wasm-bindgen install.
      - uses: cargo-bins/cargo-binstall@v1.13.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: .bin
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # wasm-pack honors CHROMEDRIVER; point it at the image's chromedriver, matched to the
      # google-chrome the driver auto-discovers on PATH. Print both versions first so a future
      # image skew is obvious in the log.
      - name: Run WebGL2 smoke test
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          google-chrome --version
          "$CHROMEDRIVER" --version
          just test-wasm-gl

  # Native offscreen render tests for retroglyph-gl (issue #376). The windowed GL context needs a
  # real window, so it can't run here; the crate's `src/headless.rs` instead creates an EGL
  # surfaceless context (glutin's EGL-device path), runs the real pipeline into an FBO, and reads
  # the pixels back to assert on them (property checks + pixel-for-pixel parity with the
  # retroglyph-software CPU rasterizer). CI has no GPU, so it forces Mesa's llvmpipe software
  # rasterizer. RETROGLYPH_REQUIRE_GL turns a missing/broken Mesa install into a hard failure here
  # (elsewhere those tests skip), so this job can't silently pass without actually rendering.
  # Linux-only by design (the tests are `cfg(target_os = "linux")`); the WebGL2 browser path is
  # tracked separately in #370.
  gl-headless:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      RETROGLYPH_REQUIRE_GL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # llvmpipe (software GL) plus the Mesa EGL driver that exposes the surfaceless EGL device the
      # headless context is built from.
      - name: Install Mesa (llvmpipe) + EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1-mesa-dri libglvnd0
      - run: cargo test -p retroglyph-gl --features default-font,tilesets -- headless

  # Offscreen render tests for retroglyph-wgpu, the sibling of gl-headless above. The windowed path
  # needs a real window, so the crate's `src/headless.rs` instead requests a device with no
  # compatible surface, runs the real pipeline into a texture, and reads the pixels back (property
  # checks + pixel-for-pixel parity with the retroglyph-software CPU rasterizer). Unlike the GL
  # equivalent this needs no platform-specific context setup, since "no surface" is first-class on
  # every wgpu backend; what it does need is a driver, and CI has no GPU, so this installs Mesa's
  # lavapipe (the Vulkan software rasterizer) and pins WGPU_BACKEND to it. RETROGLYPH_REQUIRE_WGPU
  # turns a missing adapter into a hard failure here (elsewhere those tests skip), so the job can't
  # silently pass without actually rendering.
  wgpu-headless:
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
      RETROGLYPH_REQUIRE_WGPU: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa (lavapipe) + the Vulkan loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary || true
      - run: cargo test -p retroglyph-wgpu --features default-font,tilesets -- headless

  test-wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # `just test-wasm` runs everything through `cargo bin` (cargo-run-bin), which installs the
      # versions pinned in Cargo.toml's [workspace.metadata.bin] into ./.bin -- not $CARGO_HOME/bin
      # -- so a plain taiki-e/install-action install of wasm-pack/wasm-bindgen-cli onto PATH would
      # never be seen by it. Two things actually make that install fast instead of a from-source
      # `cargo install` on every run: cargo-binstall on PATH (cargo-run-bin prefers it over
      # building from source, same as the Build WASM examples step in docs.yml) as a cold-cache
      # fallback, and caching ./.bin itself so a warm cache skips the install step entirely.
      - uses: cargo-bins/cargo-binstall@v1.13.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: .bin
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just test-wasm

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Generate coverage
        run: just coverage-ci
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # One combined workspace lcov.info, attributed per crate: each flag below is
          # scoped by its own `paths:` in codecov.yml, so a single upload still yields
          # per-crate coverage numbers instead of one blended workspace figure.
          flags: core,terminal,crossterm,terminal-wasm,software,gl,wgpu,window,widgets
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  required:
    runs-on: ubuntu-latest
    needs:
      - changes
      - format
      - lint
      - docs
      - compile
      - test
      - test-wasm
      - compile-wasm-gl
      - test-wasm-gl
      - gl-headless
      - wgpu-headless
      - coverage
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON"
          has_failed="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$has_failed" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
