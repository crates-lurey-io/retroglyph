[package]
name = "retroglyph-crossterm"
version = "0.2.3"
description = "Crossterm terminal backend for retroglyph"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Forwards `retroglyph-core`'s `dev` feature, which forces development diagnostics on in a build
# that would otherwise compile them out (see [`retroglyph_core::dev`]).
dev = ["retroglyph-core/dev"]
# Forwards to `retroglyph-terminal`'s `egc` feature (which forwards to `retroglyph-core`'s),
# enabling grapheme-cluster-aware cell diffing.
#
# This crate has no code of its own gated on the flag; it exposes it so callers don't need to know
# which crate in the terminal family actually implements it.
egc = ["retroglyph-terminal/egc", "retroglyph-core/egc"]
# Instruments `draw`, `flush`, and `poll_event` with `tracing` spans for profiling render/input
# time.
#
# See where time is spent with any `tracing` subscriber (e.g. `tracing-subscriber`'s fmt layer, or
# a flamegraph via `tracing-flame`).
tracing = ["dep:tracing"]

[dependencies]
retroglyph-core = { path = "../core", version = "0.5.0", default-features = false, features = ["std"] }
retroglyph-terminal = { path = "../terminal", version = "0.1.6" }
crossterm = "0.28"
# Only pulled in behind the `tracing` feature (see below); the `draw`/`flush`/`poll_event`
# spans this enables are the only code in this crate that references it.
tracing = { version = "0.1", optional = true, default-features = false, features = ["std", "attributes"] }

[dev-dependencies]
criterion = "0.5"
fastrand = "2"

[[bench]]
name = "event_translation"
harness = false

[[bench]]
name = "draw_overhead"
harness = false

[[bench]]
name = "backend_overhead"
harness = false
