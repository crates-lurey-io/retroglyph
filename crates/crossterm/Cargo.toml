[package]
name = "retroglyph-crossterm"
version = "0.4.0"
description = "Crossterm terminal backend for retroglyph"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Forwards `retroglyph-core`'s `dev` feature, which forces development diagnostics on in a build
# that would otherwise compile them out (see [`retroglyph_core::dev`]).
dev = ["retroglyph-core/dev"]
# Forwards to `retroglyph-terminal`'s `egc` feature (which forwards to `retroglyph-core`'s),
# enabling grapheme-cluster-aware cell diffing.
#
# This crate has no code of its own gated on the flag; it exposes it so callers don't need to know
# which crate in the terminal family actually implements it.
egc = ["retroglyph-terminal/egc", "retroglyph-core/egc"]
# Instruments `draw`, `flush`, and `poll_event` with `tracing` spans for profiling render/input
# time.
#
# See where time is spent with any `tracing` subscriber (e.g. `tracing-subscriber`'s fmt layer, or
# a flamegraph via `tracing-flame`).
tracing = ["dep:tracing"]

[dependencies]
retroglyph-core = { path = "../core", version = "0.7.0", default-features = false, features = ["std"] }
retroglyph-terminal = { path = "../terminal", version = "0.1.8" }
crossterm = "0.28"
# Only pulled in behind the `tracing` feature (see below); the `draw`/`flush`/`poll_event`
# spans this enables are the only code in this crate that references it.
tracing = { version = "0.1", optional = true, default-features = false, features = ["std", "attributes"] }

[dev-dependencies]
criterion = "0.5"
fastrand = "2"
# Cross-backend Output/Cursor conformance harness (retroglyph#763): dev-only, so the `testing`
# feature's assertion helpers never ship in a release build of this crate. `default-features =
# false` matches the `[dependencies]` entry above: a dev-dependency's features unify with it
# regardless, so leaving the default `true` here would silently turn `egc` (and the rest of
# core's defaults) back on for every crate built alongside this one in the same `cargo`
# invocation (e.g. `just test-default-features`, which deliberately keeps `egc` off).
# No `version` key, unlike the `[dependencies]` entry: a dev-dependency that has one is kept in
# the packaged manifest and has to resolve against the registry, so `testing` would need to be
# live on crates.io before any crate that tests with it could publish. It isn't (it postdates
# core 0.5.0), which broke this crate's first publish. Cargo drops a version-less dev-dependency
# when packaging, so a test-only feature of a sibling crate no longer gates anyone's release.
retroglyph-core = { path = "../core", default-features = false, features = ["testing"] }

[[bench]]
name = "event_translation"
harness = false

[[bench]]
name = "draw_overhead"
harness = false

[[bench]]
name = "backend_overhead"
harness = false
