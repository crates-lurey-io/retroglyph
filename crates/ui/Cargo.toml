[package]
name = "retroglyph-ui"
version = "0.4.1"
description = "Immediate-mode terminal UI toolkit for retroglyph: widgets, layout, input/focus, theming, and animation"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
# Forwards `retroglyph-core`'s `dev` feature, which forces development diagnostics on in a build
# that would otherwise compile them out (see [`retroglyph_core::dev`]).
dev = ["retroglyph-core/dev"]
# Forwards to `retroglyph-core`'s `egc` feature.
#
# Upgrades [`Paragraph`]'s word-wrap (always available) to grapheme-cluster-aware correctness.
egc = ["retroglyph-core/egc"]
# Uses `retroglyph-core`'s `libm` feature (the `no_std` float backend: easing curves and
# tweens, scrollbar geometry, gauge/sparkline/bar percentage rounding, scroll momentum decay)
# instead of `std`'s own float intrinsics. See `std` below; a build needs exactly one of the two.
libm = ["retroglyph-core/libm"]
# Adds `Serialize`/`Deserialize` impls for [`Theme`] and `Density`, forwarding to
# `retroglyph-core`'s `serde` feature.
#
# [`Theme`] round-trips through `Color`'s own `serde` impl.
serde = ["dep:serde", "retroglyph-core/serde"]
# Enables `retroglyph-core/std`, whose float intrinsics back this crate's own float use (see
# `libm` above for the `no_std` alternative).
#
# Disabling this feature (`--no-default-features`) builds this crate `no_std` (requires an
# allocator and one of `std`/`libm`; see the crate-level `compile_error!` in `src/lib.rs`).
std = ["retroglyph-core/std"]

[dependencies]
retroglyph-core = { path = "../core", version = "0.6.0", default-features = false }
# `Camera::scroll_by`'s signed delta: `Pos<u16>::saturating_add_signed` takes a `Pos<i32>`, and
# `retroglyph-core` only re-exports the `Pos<u16>` alias, so this needs the crate directly rather
# than going through `retroglyph-core`.
ixy = "0.8.0"
# `Theme`/`Density`'s `serde` feature below. A separate optional dependency from
# `retroglyph-core`'s own (rather than re-exported), matching how each crate here already
# depends on `retroglyph-core` independently.
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.5"
fastrand = "2"
# `Theme`/`Density`'s `#[cfg(feature = "serde")]` round-trip tests. See retroglyph-core's
# Cargo.toml for why this is unconditional despite only being used behind that feature.
serde_json = "1"

[[bench]]
name = "table_render"
harness = false

[[bench]]
name = "list_sparkline_render"
harness = false

[[bench]]
name = "layout_solve"
harness = false

[[bench]]
name = "text_truncate"
harness = false

[[bench]]
name = "hit_testing"
harness = false
