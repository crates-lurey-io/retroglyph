[package]
name = "retroglyph-terminal"
version = "0.1.6"
description = "Shared ANSI/SGR cell-diff renderer for retroglyph's terminal-family backends"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
retroglyph-core = { path = "../core", version = "0.5.0", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = "0.5"
fastrand = "2"

[features]
# Forwards to retroglyph-core's egc feature; this crate has EGC-aware and
# non-EGC-aware code paths gated on the same flag name.
# Forwards `retroglyph-core`'s `dev` feature, which forces development diagnostics on in a build
# that would otherwise compile them out (see `retroglyph_core::dev`). Forwarded so a consumer of
# this crate can turn them on without adding a direct dependency on core just to reach the flag.
dev = ["retroglyph-core/dev"]
egc = ["retroglyph-core/egc"]

[[bench]]
name = "frame_render"
harness = false

[[bench]]
name = "wide_char"
harness = false
required-features = ["egc"]
