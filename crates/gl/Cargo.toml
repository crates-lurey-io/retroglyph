[package]
name = "retroglyph-gl"
version = "0.3.3"
description = "GPU rendering backend for retroglyph: OpenGL 3.3 (native) and WebGL2 (wasm) via glow"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# NOTE: this crate deliberately does NOT use `[lints] workspace = true`.
# The workspace sets `unsafe_code = "forbid"`, which cannot be relaxed by an inner `#![allow]`.
# A `glow`/`glutin` GPU backend is unavoidably unsafe (every GL call, every context-creation call),
# so this crate mirrors the workspace lint table below with `unsafe_code = "allow"` instead of
# forbidding it. Every other workspace lint (pedantic/nursery clippy, missing_docs, etc.) is kept
# identical, so this crate is held to the same standard everywhere unsafe isn't involved.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
module_name_repetitions = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "warn"
unescaped_backticks = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Embeds the Unscii 16 default font so a caller can build a renderer with no font of its own.
#
# Forwards to `retroglyph-window`'s `default-font` feature.
default-font = ["retroglyph-window/default-font"]
# Forwards `retroglyph-core`'s `dev` feature, which forces development diagnostics on in a build
# that would otherwise compile them out (see [`retroglyph_core::dev`]).
dev = ["retroglyph-core/dev"]
# PNG sprite/tileset support (issue #366): decodes sprite sheets into an RGBA `TEXTURE_2D_ARRAY`
# atlas and draws them in a second, source-over blended pass.
#
# Forwards to `retroglyph-window`'s shared tileset decode, and (Linux only, where it's a
# dependency at all) to the `retroglyph-software` dev-dependency's own `tilesets`, so the two
# stay in lockstep: without this, `cargo test -p retroglyph-gl` (this feature off) still pulls in
# `retroglyph-window/tilesets` transitively through that dev-dependency's forced-on `tilesets`
# below, and the `PresenterBuilder` impl's `tileset` method (gated on this crate's own `tilesets`
# feature, matching every other tileset-gated item in this crate) would then be missing an item
# the trait requires whenever `retroglyph-window/tilesets` is on, regardless of this crate's own
# flag (retroglyph#1192). Harmless outside a test build: `retroglyph-software` is dev-only, so
# this half of the forward is a no-op for a plain `cargo build`/`check`.
tilesets = ["retroglyph-window/tilesets", "retroglyph-software/tilesets"]

[dependencies]
retroglyph-core = { path = "../core", version = "0.7.2", default-features = false, features = ["std"] }
# The glyph source (BitmapFont + unscii16) lives in retroglyph-window's winit-free `font` module,
# which this crate already depends on for `Presenter`. `default-font` forwards to window's feature.
retroglyph-window = { path = "../window", version = "0.5.3", default-features = false }
# 0.17 fixed a WebGL2 bug where the web backend passed `texImage3D`'s `depth` and `border`
# arguments swapped, which made the glyph-atlas upload fail (`INVALID_VALUE: texImage3D: border
# != 0`) so no text rendered in the browser. 0.18 adds a wasm64 dependency on
# `wasm-bindgen ~0.2.123`; because Cargo unifies target-specific deps in one lockfile, moving to it
# required bumping the whole workspace wasm-bindgen stack in lockstep (wasm-bindgen 0.2.126 +
# matching wasm-bindgen-cli/wasm-bindgen-test), which is why the pins below are 0.2.126, not the
# older 0.2.106.
glow = "0.18"
log = "0.4"
raw-window-handle = "0.6"

# Native GL context creation (EGL/GLX/WGL/CGL) from the window's raw handles. Not needed on wasm,
# where the WebGL2 context comes from the canvas via web-sys.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glutin = "0.32"

[dev-dependencies]
# Cross-backend Output conformance harness (retroglyph#763): dev-only, so the `testing` feature's
# assertion helpers never ship in a release build of this crate. `default-features = false`
# matches the `[dependencies]` entry above: a dev-dependency's features unify with it regardless,
# so leaving the default `true` here would silently turn `egc` (and the rest of core's defaults)
# back on for every crate built alongside this one in the same `cargo` invocation (e.g. `just
# test-default-features`, which deliberately keeps `egc` off).
# No `version` key, unlike the `[dependencies]` entry: a dev-dependency that has one is kept in
# the packaged manifest and has to resolve against the registry, so `testing` would need to be
# live on crates.io before any crate that tests with it could publish. It isn't (it postdates
# core 0.5.0), which broke this crate's first publish. Cargo drops a version-less dev-dependency
# when packaging, so a test-only feature of a sibling crate no longer gates anyone's release.
retroglyph-core = { path = "../core", default-features = false, features = ["testing"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The README quick start and `GlBackendBuilder`'s doc example call into `retroglyph_window::winit`;
# this crate's own `[dependencies]` entry disables `winit` (a GL renderer doesn't need the loop to
# implement `Presenter`), so doctests need it turned back on to compile those examples.
retroglyph-window = { path = "../window", version = "0.5.3", features = ["winit"] }

# Headless render tests (src/headless.rs, Linux/EGL only): they create an EGL surfaceless context,
# run the real pipeline into an offscreen FBO, and read the pixels back to compare against the CPU
# rasterizer (cross-backend parity). `retroglyph-software` is that reference rasterizer; both
# backends share `retroglyph-window`'s font, so the comparison is a real pixel-identity check.
[target.'cfg(target_os = "linux")'.dev-dependencies]
# `default-font` only; `tilesets` is forwarded from this crate's own `tilesets` feature above
# instead of forced on here, so a plain `cargo test -p retroglyph-gl` (that feature off) doesn't
# drag `retroglyph-window/tilesets` in behind this crate's own flag's back (retroglyph#1192).
# Deliberately no `version` key (see the equivalent dev-dependency in crates/window/Cargo.toml):
# release-plz doesn't order publishing by dev-dependency edges, only real ones, so a version pin
# here would make packaging this crate require `retroglyph-software` to already be on crates.io
# even though nothing else establishes that ordering. Dropping `version` drops the entry from the
# published manifest instead of resolving it against the registry.
retroglyph-software = { path = "../software", default-features = false, features = [
  "default-font",
] }
# Generates tiny in-memory PNG tilesets for the sprite render tests (issue #366).
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Version pinned to match the rest of the workspace (crates/window, crates/software, examples):
# the CLI and the crate version must agree.
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  # Context-loss recovery (issue #373): `Event::prevent_default` on `webglcontextlost`, and
  # `EventTarget::add/remove_event_listener_with_callback` to (de)register the canvas listeners.
  "Event",
  "EventTarget",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Drives the live WebGL2 render smoke test (src/webgl_smoke.rs) in a headless browser -- the only
# place the wasm32/WebGL2 draw path actually executes (the `compile-wasm-gl` CI job just
# build-checks it). Run via `just test-wasm-gl` (`wasm-pack test --headless --chrome`). Version
# pinned in lockstep with the `wasm-bindgen` dependency above, exactly as crates/terminal-wasm
# does: 0.3.76 is the wasm-bindgen-test release cut from the same wasm-bindgen-repo tag as
# wasm-bindgen 0.2.126, so it's the only version that resolves against this crate's pin. If the
# `wasm-bindgen` pin moves, this must move in lockstep.
wasm-bindgen-test = "=0.3.76"
# The context-loss recovery test (src/webgl_recovery.rs) forces a real lost/restored cycle via the
# `WEBGL_lose_context` extension and awaits the async restore event, so it needs the extension type
# plus a Promise-based `setTimeout` sleep. `js-sys`/`wasm-bindgen-futures`/the extra `web-sys`
# feature are test-only; `web-sys` unifies with the dependency features above.
web-sys = { version = "0.3", features = ["WebglLoseContext"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
# Generates a tiny in-memory PNG tileset for the sprite render smoke test (issue #366).
image = { version = "0.25", default-features = false, features = ["png"] }
