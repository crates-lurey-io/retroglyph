[package]
name = "retroglyph-recorder"
version = "0.1.0"
description = "Input recording & replay for retroglyph: record a real session, replay it through a live App"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `testing` for `InputRecording`/`TestHarness` (this crate's `.rgrec` format is `InputRecording`
# serialized, and `replay_live` shares the same `App`-driving contract `TestHarness::replay`
# does); `serde` so `InputRecording` (and the `Event` stream it carries) can round-trip through
# `serde_json`. `std` for `Terminal`/`App::run_on`-shaped driving and this crate's own file I/O.
retroglyph-core = { path = "../core", version = "0.7.1", default-features = false, features = [
  "std",
  "testing",
  "serde",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
