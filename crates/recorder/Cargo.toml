[package]
name = "retroglyph-recorder"
version = "0.1.0"
description = "Input recording & replay for retroglyph: record a real session, replay it through a live App"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `testing` for `InputRecording`/`TestHarness` (this crate's `.rgrec` format is `InputRecording`
# serialized, and `replay_live` shares the same `App`-driving contract `TestHarness::replay`
# does); `serde` so `InputRecording` (and the `Event` stream it carries) can round-trip through
# `serde_json`. `std` for `Terminal`/`App::run_on`-shaped driving and this crate's own file I/O.
retroglyph-core = { path = "../core", version = "0.8.0", default-features = false, features = [
  "std",
  "testing",
  "serde",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `pty`: promotes `examples/tests/support`'s PTY/`vt100`-driven capture technique to a public,
# reusable capture source feeding the same `write_cast` (see `pty.rs`) -- the mechanism
# retroglyph#461's "supersede the `vhs` tape plan" bet rests on. Both crates are MIT-licensed and
# already used elsewhere in this workspace (`examples/Cargo.toml`), so this adds no new licensing
# question.
portable-pty = { version = "0.9", optional = true }
vt100 = { version = "0.16", optional = true }

[dev-dependencies]
insta = "1.34"

[features]
# A real-pseudo-terminal capture source (`pty::capture_pty`) feeding the same `write_cast` path
# `FrameRecorder` does, for `vhs`-like real-terminal fidelity. Adds `portable-pty`/`vt100`.
pty = ["dep:portable-pty", "dep:vt100"]

[[test]]
name = "pty_capture"
required-features = ["pty"]
