[package]
name = "retroglyph-core"
version = "0.5.0"
description = "A 2D pseudographic terminal library -- core types, no backend"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "egc"]
# Forces `BuildMode::Dev` on in a build that would otherwise resolve to `Release`.
#
# Can be used so an optimized build still reports development diagnostics (see the [`dev`]
# module).
dev = []
# Enables grapheme-cluster-aware text handling (via `unicode-segmentation`) for EGC-correct cell
# diffing and layout.
egc = ["dep:unicode-segmentation"]
# Uses `libm`'s software float implementation (`roundf`/`fmaf`/`sinf`/`cosf`/`powf`) for
# `animate`'s easing curves and the separable [`BlendMode`] channel math, via this crate's own
# `math` shim -- the `no_std` side of that split. See `std` below for the alternative that prefers
# the platform's own float intrinsics when available; a build needs exactly one of the two.
libm = [
    "dep:libm",
    "dep:alpha-blend",
    "gem/libm",
    "gem/libm-arch",
    "alpha-blend/libm",
    "alpha-blend/libm-arch",
]
# Adds `Serialize`/`Deserialize` impls for [`Color`], [`Style`], `Size`, `Offset`, and (via `ixy`)
# `Pos`/`Rect`, so a config file can round-trip a saved camera position, window geometry, sub-cell
# pixel offset, or theme color.
#
# [`Color`] serializes through its `Display`/`FromStr` round trip (e.g. `"bright-red"`,
# `"#ff8000"`) rather than a derived structural form, so hand-edited TOML/JSON stays legible.
serde = ["dep:serde", "ixy/serde"]
# Enables `gem/std` and `alpha-blend/std`, and uses `std`'s float intrinsics (via this crate's
# `math` shim) instead of `libm`'s software implementation for `animate` and the separable
# [`BlendMode`] channel math.
#
# Disabling this feature (`--no-default-features`) builds this crate `no_std`, and then needs
# `libm` above as the float backend instead: see the crate-level `compile_error!` in `src/lib.rs`.
std = ["dep:alpha-blend", "gem/std", "alpha-blend/std"]
# Enables `testing`'s `TestHarness`, which drives an [`App`] against [`Headless`] for tests, with
# synthetic input queuing and frame-settling helpers.
#
# Test-only surface, `no_std` + `alloc` compatible, off by default so it never ships in a release
# build by accident.
testing = []

[dependencies]
# `default-features = false` so gem's float backend is picked by this crate's own `std`/`libm`
# (which forward `gem/std`/`gem/libm`) rather than by gem's defaults. gem prefers std's float
# intrinsics over libm when both are present, so a `std` build gets std math with libm sitting
# inert. `gem/space` (perceptual color spaces, the named-color table) arrives either way: both
# `gem/std` and `gem/libm` list it, and one of this crate's `std`/`libm` is mandatory.
gem = { version = "0.2.2", default-features = false }
# SCREEN/DODGE/BURN/OVERLAY/MULTIPLY blend modes for `Grid::blit_alpha` (see `BlendMode`); linear
# blending stays on `gem::Mix`/`gem::rgb::Rgb888::mix_u8` above and needs no math backend.
# No longer behind a feature of its own (retroglyph#903): that feature gated `BlendMode`'s own
# *variants*, so the enum's shape varied with the feature matrix -- downstream `match` arms had to
# be feature-aware and `cargo-semver-checks` saw a different type per feature set. It was a
# dev-dependency in every configuration already anyway, via `tests/rounding_conformance.rs`.
#
# `optional` here is a diagnostics detail, not a way to build without it: `std` and `libm` both
# list `dep:alpha-blend` and one of them is mandatory, so every configuration that compiles at all
# has this. Declared non-optional instead, a backendless build fails while *building alpha-blend*
# ("Either the 'std' or 'libm' feature must be enabled for alpha-blend") and cargo never gets far
# enough to compile this crate and report the `compile_error!` that names the two features to turn
# on; `just compile` asserts that diagnostic to keep it that way. The `dep:` prefix also
# suppresses the implicit `alpha-blend` feature an optional dependency otherwise adds to the
# public matrix. `default-features = false` for the same reason as gem, immediately above.
alpha-blend = { version = "0.3", optional = true, default-features = false }
ixy = "0.8.0"
# `Color`'s `serde` impls (see color.rs) are hand-written against its own `Display`/`FromStr`, so
# they need only the `derive` feature for `Style`/`Size`'s plain `#[derive(Serialize, Deserialize)]`
# below -- no `alloc` feature, since nothing here deserializes into an owned `String`/`Vec`.
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
# Pure-Rust sin/cos/round/pow for `animate`'s trig-based easing curves, its oscillator, and the
# separable `BlendMode` channel math, via this crate's own `math` shim (see `src/math.rs`) -- the
# `no_std` side of the `std`/`libm` split those call sites need (see the `libm` feature above).
#
# `default-features` is deliberately left on: `libm`'s `arch` feature is what lowers `fmaf`/`sqrtf`
# to a single hardware instruction (`fmadd`/`fsqrt` on aarch64) instead of a software fallback,
# and that's the fast path this crate's `libm` feature exists to guarantee. `gem` and
# `alpha-blend` both set `default-features = false` here and re-add `arch` through their own
# `libm-arch` feature, which means a consumer who enables `libm` but forgets `libm-arch` silently
# gets the slow path on those two. Don't copy that asymmetry onto this dependency: making `arch`
# unconditional here means the fast path can't be lost by omission, which is the whole point
# (retroglyph#886). There is no matching `libm-arch` feature on this crate to mirror theirs; it
# would be inert, since `libm` above already guarantees `arch` (retroglyph#977).
libm = { version = "0.2", optional = true }
grixy = { version = "0.7.0", features = ["alloc", "buffer"] }
unicode-width = "0.2"
bitflags = "2.4"
unicode-segmentation = { version = "1.13", default-features = false, optional = true }

[dev-dependencies]
unicode-width = "0.2"
insta = { version = "1.34", features = ["yaml"] }
proptest = "1"
criterion = "0.5"
fastrand = "2"
# `Color`'s `#[cfg(feature = "serde")]` round-trip tests in color.rs. A plain dev-dependency (not
# gated on the `serde` feature) is fine: dev-dependencies never reach the published dependency
# tree, and the tests that use it are themselves `#[cfg(feature = "serde")]`.
serde_json = "1"

[[bench]]
name = "grid_diff"
harness = false

[[bench]]
name = "grid_construct"
harness = false

[[bench]]
name = "flatten"
harness = false

[[bench]]
name = "fill_region"
harness = false

[[bench]]
name = "blit"
harness = false

[[bench]]
name = "subcell"
harness = false

[[bench]]
name = "color"
harness = false
