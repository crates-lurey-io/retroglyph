[package]
name = "retroglyph-core"
version = "0.5.0"
description = "A 2D pseudographic terminal library -- core types, no backend"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# gem's pixel-format layer (`rgb`/`gray`/`alpha`/`channel`) needs no math backend at all, so this
# is unconditional: every retroglyph-core build, including `--no-default-features`, gets const
# integer channel math and the 8-bit color formats. `gem`'s own `space`/`named`/`blend` modules
# (perceptual color spaces, the named-color table, its blend helpers) are cfg-gated behind a math
# backend on gem's side, and only compile in here once `std` or `color-space` turns on `gem/std`
# or `gem/libm` below -- so this dependency being unconditional does not itself turn on gem's
# float-math cost. See the `color-space` feature for what actually gates that.
gem = { version = "0.2", default-features = false }
# SCREEN/DODGE/BURN/OVERLAY blend modes for `Grid::blit_alpha` (see `BlendMode`); linear blending
# stays on `gem::Mix`/`gem::rgb::Rgb888::mix_u8` above. Same std/libm split as `gem` (see the
# `color-space`/`std` features below) and gated behind the `color-space` feature -- one crate
# feature covers all of blit_alpha's blend modes rather than splitting into a second flag for
# what's one capability to callers.
alpha-blend = { version = "0.3", optional = true, default-features = false }
ixy = "0.6.0-alpha.9"
# Pure-Rust sin/cos/pow for `animate`'s trig-based easing curves and its oscillator -- unlike
# `gem`'s libm usage (internal to its own color-space math, not reusable here), this is a plain,
# always-on dependency: no_std-compatible on its own, so no std/libm feature split is needed the
# way `gem` needs one.
libm = "0.2"
grixy = { version = "0.6.0-alpha.8", features = ["alloc", "buffer"] }
unicode-width = "0.2"
bitflags = "2.4"
unicode-segmentation = { version = "1.13", default-features = false, optional = true }

[features]
default = ["std", "egc", "color-space"]
# `gem/std` is unconditional (gem is no longer optional, see the dependency above); `alpha-blend?/std`
# only applies once `color-space` has pulled alpha-blend in. gem prefers std float intrinsics over
# libm when both are present, so a std build that also enables `color-space` gets std math with
# libm sitting inert -- no code change in retroglyph-core either way.
std = ["gem/std", "alpha-blend?/std"]
# Forces `BuildMode::Dev` on in a build that would otherwise resolve to `Release`, so an
# optimized build still reports development diagnostics (see the `dev` module). Off by default:
# the default signal is `debug_assertions`, which already follows the consumer's own profile.
# There is intentionally no feature for the reverse -- see the `dev` module docs on why a
# `no-dev` feature cannot work under additive feature unification.
dev = []
egc = ["dep:unicode-segmentation"]
# Renamed from `gem` (retroglyph#547 phase 3): with gem now an unconditional dependency (see
# above), a feature called `gem` no longer gated `dep:gem` itself -- its pixel-format layer is
# always available, and its `space`/`named` modules already compile in any build that turns on
# `gem/std` or `gem/libm`, including a plain `std` build with this feature off. What this feature
# actually gates is `alpha-blend` (the W3C separable blend modes on `BlendMode`) plus `libm` for
# gem's float math in a `no_std` build -- i.e. perceptual color-space cost, not gem's presence.
color-space = ["gem/libm", "dep:alpha-blend", "alpha-blend/libm"]
# `retroglyph_core::testing`'s `TestHarness`: drives an `App` against `Headless` for tests, with
# synthetic input queuing and frame-settling helpers (retroglyph#612). Test-only surface, `no_std`
# + `alloc` compatible (no `std` dependency), off by default so it never ships in a release build
# by accident.
testing = []

[dev-dependencies]
unicode-width = "0.2"
insta = { version = "1.34", features = ["yaml"] }
proptest = "1"
criterion = "0.5"
fastrand = "2"
# Non-optional here even though it's also an optional normal dependency (Cargo unifies the two):
# `tests/rounding_conformance.rs` checks gem and alpha-blend agree on the shared round-to-nearest
# invariant (retroglyph#547), and needs to run on every CI invocation regardless of which features
# are on, not just when `color-space` happens to be enabled.
alpha-blend = { version = "0.3", default-features = false, features = ["libm"] }

[[bench]]
name = "grid_diff"
harness = false

[[bench]]
name = "grid_construct"
harness = false

[[bench]]
name = "flatten"
harness = false

[[bench]]
name = "blit"
harness = false

[[bench]]
name = "subcell"
harness = false

[[bench]]
name = "color"
harness = false
