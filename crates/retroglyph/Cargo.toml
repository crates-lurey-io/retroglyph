[package]
name = "retroglyph"
version = "0.1.0"
description = "A 2D pseudographic terminal library -- the consumer-facing facade over retroglyph-core and its backend/helper crates"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["crossterm", "ui"]
# Re-exports `retroglyph-crossterm` as [`crossterm`]: a real-terminal `Backend`
# via `crossterm`.
crossterm = ["dep:retroglyph-crossterm"]
# Forwards each enabled backend's own `default-font` feature (an embedded Unscii 16 bitmap font),
# so a caller doesn't need to know which backend crate actually owns it.
default-font = [
  "retroglyph-window?/default-font",
  "retroglyph-software?/default-font",
  "retroglyph-gl?/default-font",
  "retroglyph-wgpu?/default-font",
]
# Re-exports `retroglyph-gl` as [`gl`]: a GPU `Backend` via `glow` (OpenGL 3.3 native,
# WebGL2 wasm). Also pulls in the curated windowed re-exports (`WindowConfig`, `PresenterBuilder`,
# `Windowed`, `WindowedLaunchError`, `run_app`, `run_app_on`).
gl = ["dep:retroglyph-gl", "dep:retroglyph-window"]
# Re-exports `retroglyph-software` as [`software`]: a CPU pixel `Backend` via
# `softbuffer`. Also pulls in the curated windowed re-exports (`WindowConfig`, `PresenterBuilder`,
# `Windowed`, `WindowedLaunchError`, `run_app`, `run_app_on`).
software = ["dep:retroglyph-software", "dep:retroglyph-window"]
# Enables [`TestHarness`] and its error, the published headless `App` driver for testing your own
# `App`. Forwards to `retroglyph-core`'s own `testing` feature.
testing = ["retroglyph-core/testing"]
# Forwards to `retroglyph-crossterm`'s `tracing` feature: instruments `draw`/`flush`/`poll_event`
# with `tracing` spans for profiling render/input time.
tracing = ["retroglyph-crossterm?/tracing"]
# Re-exports `retroglyph-ui` as [`ui`]: the immediate-mode widget/layout toolkit.
ui = ["dep:retroglyph-ui"]
# Re-exports `retroglyph-wgpu` as [`wgpu`]: a GPU `Backend` via `wgpu` (Vulkan,
# Metal, D3D12, WebGPU). Also pulls in the curated windowed re-exports (`WindowConfig`,
# `PresenterBuilder`, `Windowed`, `WindowedLaunchError`, `run_app`, `run_app_on`).
wgpu = ["dep:retroglyph-wgpu", "dep:retroglyph-window"]

[dependencies]
# `default-features = false` to control the surface deliberately, then both `std` and `egc` are
# re-added: core's own `default = ["std", "egc"]` would otherwise be redundant to state, but
# leaving it implicit here would silently lose `egc` (or `std`) the moment either crate's defaults
# change, which is exactly the surface this facade exists to pin.
retroglyph-core = { path = "../core", version = "0.7.0", default-features = false, features = [
  "std",
  "egc",
] }
retroglyph-crossterm = { path = "../crossterm", version = "0.4.0", optional = true }
retroglyph-gl = { path = "../gl", version = "0.3.1", optional = true }
retroglyph-software = { path = "../software", version = "0.6.1", optional = true }
retroglyph-ui = { path = "../ui", version = "0.4.2", optional = true }
retroglyph-wgpu = { path = "../wgpu", version = "0.1.1", optional = true }
# `winit` stays on (the default): the curated `run_app`/`run_app_on`/`WindowConfig` re-exports
# this crate adds on top of a windowed backend all live behind that feature.
retroglyph-window = { path = "../window", version = "0.5.1", optional = true }
