[package]
name = "retroglyph-widgets"
version = "0.3.1"
description = "Immediate-mode drawing helpers for retroglyph (panels, gauges, tables, sparklines)"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Forwards to retroglyph-core's egc feature. Paragraph (word-wrap) needs
# grapheme-cluster-aware TextLayout, which only exists when egc is on.
# Forwards `retroglyph-core`'s `dev` feature, which forces development diagnostics on in a build
# that would otherwise compile them out (see `retroglyph_core::dev`). Forwarded so a consumer of
# this crate can turn them on without adding a direct dependency on core just to reach the flag.
dev = ["retroglyph-core/dev"]
egc = ["retroglyph-core/egc"]

[dependencies]
# `color-space` (renamed from `gem`, retroglyph#547): retroglyph-core/Color::lerp (used by
# meter_ramp's color ramp) is gated behind it. Not a separate widgets-level feature -- color
# ramping is non-optional composite-tier functionality, not an opt-in extra like `egc`.
retroglyph-core = { path = "../core", version = "0.3.1", default-features = false, features = ["std", "color-space"] }
unicode-width = "0.2"

[dev-dependencies]
criterion = "0.5"
fastrand = "2"

[[bench]]
name = "table_render"
harness = false

[[bench]]
name = "list_sparkline_render"
harness = false

[[bench]]
name = "layout_solve"
harness = false

[[bench]]
name = "text_truncate"
harness = false

[[bench]]
name = "hit_testing"
harness = false
