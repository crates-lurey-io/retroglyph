[package]
name = "retroglyph-widgets"
version = "0.4.1"
description = "Immediate-mode drawing helpers for retroglyph (panels, gauges, tables, sparklines)"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Forwards `retroglyph-core`'s `dev` feature to force development diagnostics on in this crate too.
dev = ["retroglyph-core/dev"]
# Forwards to retroglyph-core's egc feature; enables Paragraph's grapheme-cluster-aware word-wrap.
egc = ["retroglyph-core/egc"]
# `Serialize`/`Deserialize` for `Theme` and `Density`, forwarding to `retroglyph-core/serde`.
serde = ["dep:serde", "retroglyph-core/serde"]

[dependencies]
# `indexed-quant` (retroglyph#629, previously `color-space`): retroglyph-core/Color::lerp (used
# by meter_ramp's color ramp) is gated behind it. Not a separate widgets-level feature -- color
# ramping is non-optional composite-tier functionality, not an opt-in extra like `egc`.
retroglyph-core = { path = "../core", version = "0.5.0", default-features = false, features = ["std", "indexed-quant"] }
unicode-width = "0.2"
# `Theme`/`Density`'s `serde` feature below. A separate optional dependency from
# `retroglyph-core`'s own (rather than re-exported), matching how each crate here already
# depends on `retroglyph-core` independently.
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.5"
fastrand = "2"
# `Theme`/`Density`'s `#[cfg(feature = "serde")]` round-trip tests. See retroglyph-core's
# Cargo.toml for why this is unconditional despite only being used behind that feature.
serde_json = "1"

[[bench]]
name = "table_render"
harness = false

[[bench]]
name = "list_sparkline_render"
harness = false

[[bench]]
name = "layout_solve"
harness = false

[[bench]]
name = "text_truncate"
harness = false

[[bench]]
name = "hit_testing"
harness = false
