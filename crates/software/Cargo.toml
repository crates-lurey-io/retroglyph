[package]
name = "retroglyph-software"
version = "0.4.0"
description = "Software (winit + softbuffer) pixel rendering backend for retroglyph"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
retroglyph-core = { path = "../core", version = "0.3.1", default-features = false, features = ["std"] }
# Seam only (Presenter/WindowBackend/WindowHandle): no winit. The loop is the
# caller's business -- games depend on retroglyph-window with its default
# `winit` feature; this crate just implements the renderer side.
retroglyph-window = { path = "../window", version = "0.3.1", default-features = false }
ixy = "0.6.0-alpha.9"
grixy = { version = "0.6.0-alpha.8", features = ["alloc", "buffer"] }
log = "0.4"
# PNG decode moved to retroglyph-window's shared `tileset` module (issue #366); the CPU sprite blit
# here still needs alpha-blend for straight-alpha source-over.
alpha-blend = { version = "0.2", optional = true, default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
softbuffer = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# On wasm32, present() bypasses softbuffer's web backend (which reallocates
# a fresh RGBA Vec every frame) in favor of a persistent RGBA buffer reused
# across frames; see present()'s wasm32 branch. Version pinned to match the
# wasm-bindgen dependency elsewhere in the workspace (crates/window,
# crates/terminal-wasm, examples) -- the CLI and the crate version
# must agree.
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageData",
] }

[features]
# Sprite tileset support. The decode/config lives in retroglyph-window's shared `tileset` +
# `sprite_cache` modules (issue #366); this crate adds the CPU blit on top (hence alpha-blend).
tilesets = ["dep:alpha-blend", "retroglyph-window/tilesets"]
default-font = ["retroglyph-window/default-font"]

[dev-dependencies]
insta = { version = "1.34", features = ["yaml"] }
criterion = "0.5"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
# The windowed doc example in `config.rs` calls into `retroglyph_window::winit`; this crate's own
# `[dependencies]` entry disables `winit` (a software renderer doesn't need the loop to implement
# `Presenter`), so doctests need it turned back on to compile that example.
retroglyph-window = { path = "../window", version = "0.3.1", features = ["winit"] }

[[bench]]
name = "raster"
harness = false

[[bench]]
name = "damage"
harness = false

[[bench]]
name = "blit"
harness = false

[[bench]]
name = "resolve_color"
harness = false
