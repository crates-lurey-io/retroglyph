[package]
name = "retroglyph-software"
version = "0.6.3"
description = "Software (winit + softbuffer) pixel rendering backend for retroglyph"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Embeds the Unscii 16 bitmap font as a ready-to-use default `FontChain`.
#
# Forwards to `retroglyph-window`'s `default-font` feature.
default-font = ["retroglyph-window/default-font"]
# Forwards `retroglyph-core`'s `dev` feature, which forces development diagnostics on in a build
# that would otherwise compile them out (see [`retroglyph_core::dev`]).
dev = ["retroglyph-core/dev"]
# PNG sprite sheet tilesets with alpha-blended CPU blit support.
#
# Adds `alpha-blend` and forwards to `retroglyph-window`'s `tilesets` feature for decode/config.
tilesets = ["dep:alpha-blend", "retroglyph-window/tilesets"]

[dependencies]
retroglyph-core = { path = "../core", version = "0.7.2", default-features = false, features = ["std"] }
# Seam only (Presenter/WindowBackend/WindowHandle): no winit. The loop is the
# caller's business -- games depend on retroglyph-window with its default
# `winit` feature; this crate just implements the renderer side.
retroglyph-window = { path = "../window", version = "0.5.3", default-features = false }
ixy = "0.7.0"
grixy = { version = "0.7.0", features = ["alloc", "buffer"] }
log = "0.4"
# PNG decode moved to retroglyph-window's shared `tileset` module (issue #366); the CPU sprite blit
# here still needs alpha-blend for straight-alpha source-over.
alpha-blend = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
softbuffer = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# On wasm32, present() bypasses softbuffer's web backend (which reallocates
# a fresh RGBA Vec every frame) in favor of a persistent RGBA buffer reused
# across frames; see present()'s wasm32 branch. Version pinned to match the
# wasm-bindgen dependency elsewhere in the workspace (crates/window,
# crates/terminal-wasm, examples) -- the CLI and the crate version
# must agree.
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageData",
] }

[dev-dependencies]
# Cross-backend Output/Cursor conformance harness (retroglyph#763): dev-only, so the `testing`
# feature's assertion helpers never ship in a release build of this crate. `default-features =
# false` matches the `[dependencies]` entry above: a dev-dependency's features unify with it
# regardless, so leaving the default `true` here would silently turn `egc` (and the rest of
# core's defaults) back on for every crate built alongside this one in the same `cargo`
# invocation (e.g. `just test-default-features`, which deliberately keeps `egc` off).
# No `version` key, unlike the `[dependencies]` entry: a dev-dependency that has one is kept in
# the packaged manifest and has to resolve against the registry, so `testing` would need to be
# live on crates.io before any crate that tests with it could publish. It isn't (it postdates
# core 0.5.0), which broke this crate's first publish. Cargo drops a version-less dev-dependency
# when packaging, so a test-only feature of a sibling crate no longer gates anyone's release.
retroglyph-core = { path = "../core", default-features = false, features = ["testing"] }
insta = { version = "1.34", features = ["yaml"] }
criterion = "0.8"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
# The windowed doc example in `config.rs` calls into `retroglyph_window::winit`; this crate's own
# `[dependencies]` entry disables `winit` (a software renderer doesn't need the loop to implement
# `Presenter`), so doctests need it turned back on to compile that example.
retroglyph-window = { path = "../window", version = "0.5.3", features = ["winit"] }

[[bench]]
name = "raster"
harness = false

[[bench]]
name = "damage"
harness = false

[[bench]]
name = "blit"
harness = false

[[bench]]
name = "resolve_color"
harness = false
