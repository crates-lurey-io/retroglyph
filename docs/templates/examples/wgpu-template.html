<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="__EXAMPLE__" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark" />
    <!-- No web app manifest here (unlike software-template.html): the `wgpu`
         variant of tools/build-wasm-example.sh does not emit a
         manifest.webmanifest, so linking one would 404. Add a wgpu manifest to
         the build script and a link here if the WebGPU build should be
         installable as a PWA. -->
    <title>retroglyph — __EXAMPLE__ (WebGPU)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        touch-action: none;
        /* retroglyph-window sets the canvas's inline size to the browser
           viewport at startup and on every `resize` event (winit's web
           backend doesn't derive canvas size from page CSS -- see
           crates/window/src/winit/run.rs), so this is mostly a fallback for
           the first paint before that JS runs. `dvw`/`dvh` (dynamic
           viewport units) come after the `vw`/`vh` fallback so mobile
           browsers that account for retracting address bars don't leave a
           sliver of the page scrollable underneath. */
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
      }
      /* Shown only when WebGPU is missing or has no usable adapter. Unlike the
         other windowed variants, this one cannot fall back to another API: the
         backend is WebGPU or nothing. Saying so beats a black page. */
      #unsupported {
        display: none;
        width: 100%;
        height: 100%;
        padding: 2rem;
        place-content: center;
        color: #c9d1d9;
        background: #0d1117;
        font:
          15px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        text-align: center;
      }
      #unsupported a {
        color: #58a6ff;
      }
      #unsupported code {
        color: #ffa657;
      }
    </style>
  </head>
  <body>
    <div id="unsupported">
      <p><strong>This browser can't run the WebGPU build.</strong></p>
      <p style="margin-top: 1rem">
        Try Chrome or Edge 113+, or Safari 26+. In Firefox, enable
        <code>dom.webgpu.enabled</code> in <code>about:config</code>.
      </p>
      <p style="margin-top: 1rem">
        Every other variant of this example runs anywhere:
        <a href="../software/">Software</a>, <a href="../gl/">WebGL</a>,
        <a href="../headless/">Headless</a>, or
        <a href="../terminal/">Terminal</a>.
      </p>
    </div>
    <script type="module">
      // Feature detection has to be both truthy-checked and guarded. `'gpu' in navigator` is not
      // enough: a browser can define the property and still yield `undefined`, and reading
      // `.requestAdapter()` off that throws. A throw in a module script's top-level `await` rejects
      // the module silently, which would leave exactly the blank page this block exists to avoid.
      // Nor is a defined `navigator.gpu` sufficient on its own, since a browser can ship the API and
      // still produce no adapter (blocklisted driver, no compatible GPU, some headless configs).
      //
      // Note that a blank canvas for the first few frames is normal even on success:
      // retroglyph-wgpu acquires its device asynchronously, because a browser main thread can't
      // block on a future.
      const unsupported = document.getElementById('unsupported');
      let started = false;
      try {
        if (navigator.gpu && (await navigator.gpu.requestAdapter()) !== null) {
          const init = (await import('./__EXAMPLE__.js')).default;
          await init();
          started = true;
        }
      } catch (err) {
        console.error('WebGPU startup failed:', err);
      }
      if (!started) {
        unsupported.style.display = 'grid';
      }
    </script>
  </body>
</html>
