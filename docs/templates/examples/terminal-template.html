<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0d1117" />
    <title>retroglyph — __EXAMPLE__ (Terminal)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #0d1117;
        color: #e6edf3;
        overscroll-behavior: none;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem;
        min-height: 100%;
      }
      #screen {
        width: 100%;
        max-width: 46rem;
        aspect-ratio: 50 / 25;
        background: #000;
        border: 1px solid #30363d;
        border-radius: 6px;
        /* Without this, xterm.js's own (square-cornered) canvas/DOM layers
           poke past #screen's rounded corners -- border-radius only clips
           a straight-cornered child that reaches into the curve if the
           parent also has overflow set to something other than visible. */
        overflow: hidden;
        padding: 0.4rem;
        touch-action: none;
      }
      /* xterm.js sizes its internal canvas/DOM renderer to fill this. */
      #screen .terminal {
        height: 100%;
      }
      p.hint {
        color: #8b949e;
        font-size: 0.75rem;
        text-align: center;
        max-width: 30rem;
      }
      a.back {
        color: #58a6ff;
        text-decoration: none;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div id="screen"></div>

    <p class="hint">
      Tap, drag, and scroll directly on the terminal (or focus it and use arrow keys, Enter,
      Backspace, Escape, or printable characters) — this demo renders real ANSI/SGR escape codes
      via <a href="https://xtermjs.org/">xterm.js</a>, the same terminal-family renderer used by
      the native <code>crossterm</code> backend.
    </p>
    <a class="back" href="../../">&larr; Back to all examples</a>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
    <script type="module">
      import init, {
        wasm_terminal_example_init,
        wasm_terminal_example_push_key,
        wasm_terminal_example_push_mouse,
        wasm_terminal_example_tick,
      } from './__EXAMPLE__.js';
      // The xterm.js onData -> key_codes mapping is retroglyph_terminal_wasm's own
      // js/key-table.js (retroglyph#684), not re-derived here: every consumer of this crate's
      // wasm32 build gets the same table instead of hand-rolling a subset of it.
      import { decodeKeyFromXtermData } from './key-table.js';


      function handleTerminalData(data) {
        const key = decodeKeyFromXtermData(data);
        if (key) wasm_terminal_example_push_key(key.code >>> 0, key.mods & 0xff);
      }

      // ── Pointer input (tap, drag, scroll) ──────────────────────────────
      //
      // Maps pointer pixels to xterm.js cell coordinates and forwards them
      // via wasm_terminal_example_push_mouse. `kind` mirrors
      // retroglyph_examples::util::wasm_pointer::decode_mouse:
      // 0 down, 1 up, 2 move (drag), 3 scroll up, 4 scroll down.
      const KIND_DOWN = 0;
      const KIND_UP = 1;
      const KIND_MOVE = 2;
      const KIND_SCROLL_UP = 3;
      const KIND_SCROLL_DOWN = 4;

      function attachPointerInput(container, term) {
        // .xterm-screen is the element that exactly bounds the cell grid
        // (the container has padding/scrollbar slack around it).
        const gridEl = () => container.querySelector('.xterm-screen') ?? container;

        function cellFromPointer(event) {
          const rect = gridEl().getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return null;
          const fx = (event.clientX - rect.left) / rect.width;
          const fy = (event.clientY - rect.top) / rect.height;
          return {
            x: Math.min(term.cols - 1, Math.max(0, Math.floor(fx * term.cols))),
            y: Math.min(term.rows - 1, Math.max(0, Math.floor(fy * term.rows))),
          };
        }

        // Track a single pointer (first finger / left button) so a stray
        // second finger can't teleport an in-progress drag. Capture phase:
        // xterm.js installs its own handlers on inner elements for text
        // selection, and games want the raw tap/drag regardless.
        let activePointer = null;
        let lastCell = null;

        container.addEventListener(
          'pointerdown',
          (event) => {
            if (activePointer !== null) return;
            // No preventDefault: xterm still needs the event for tap-to-focus
            // (which brings up the keyboard-capable focus state on mobile).
            activePointer = event.pointerId;
            container.setPointerCapture(event.pointerId);
            const cell = cellFromPointer(event);
            if (!cell) return;
            lastCell = cell;
            wasm_terminal_example_push_mouse(cell.x, cell.y, KIND_DOWN);
          },
          { capture: true },
        );

        container.addEventListener(
          'pointermove',
          (event) => {
            if (event.pointerId !== activePointer) return;
            const cell = cellFromPointer(event);
            // Dedupe: only forward drag moves that cross a cell edge.
            if (!cell || (lastCell && cell.x === lastCell.x && cell.y === lastCell.y)) return;
            lastCell = cell;
            wasm_terminal_example_push_mouse(cell.x, cell.y, KIND_MOVE);
          },
          { capture: true },
        );

        for (const type of ['pointerup', 'pointercancel']) {
          container.addEventListener(
            type,
            (event) => {
              if (event.pointerId !== activePointer) return;
              activePointer = null;
              const cell = cellFromPointer(event) ?? lastCell;
              lastCell = null;
              if (!cell) return;
              wasm_terminal_example_push_mouse(cell.x, cell.y, KIND_UP);
            },
            { capture: true },
          );
        }

        container.addEventListener(
          'wheel',
          (event) => {
            event.preventDefault();
            const cell = cellFromPointer(event);
            if (!cell) return;
            const kind = event.deltaY < 0 ? KIND_SCROLL_UP : KIND_SCROLL_DOWN;
            wasm_terminal_example_push_mouse(cell.x, cell.y, kind);
          },
          { passive: false, capture: true },
        );
      }

      // Fixed grid size this demo runs at -- must match what
      // wasm_terminal_example_init below is called with, and what
      // HelloWorld's draw coordinates assume (see examples/examples/
      // 01_hello_world.rs). Kept constant rather than derived from the
      // page's layout via FitAddon: FitAddon.fit() picks cols/rows to
      // exactly fill whatever CSS box it's given, but a real monospace
      // character cell isn't the same aspect ratio as `#screen`'s box, so
      // that produced a different (and page-width-dependent) grid size,
      // not a stable 50x25.
      const COLS = 50;
      const ROWS = 25;
      const BASE_FONT_SIZE = 14;
      // Matches #screen's CSS `max-width: min(100%, 46rem)` (assuming the
      // usual 16px root font-size -- close enough for a soft cap here).
      const MAX_WIDTH_PX = 46 * 16;

      async function main() {
        await init();

        const term = new Terminal({
          cols: COLS,
          rows: ROWS,
          cursorBlink: true,
          fontFamily: 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace',
          fontSize: BASE_FONT_SIZE,
          theme: {
            background: '#000000',
            foreground: '#c9d1d9',
          },
        });
        const screenEl = document.getElementById('screen');
        const availableWidthEl = screenEl.parentElement;
        term.open(screenEl);

        wasm_terminal_example_init(COLS, ROWS);

        // Scales *font size* to fit the available width instead of letting
        // cols/rows change -- the grid this demo actually runs at never
        // changes, only how big each cell renders. `baseWidthPx` is
        // measured once, right after the terminal's first paint at
        // `BASE_FONT_SIZE`; because cell size scales linearly with
        // font-size for a monospace font, every later fit() just rescales
        // from that one measurement instead of resetting to the base size
        // and re-measuring (which would flash the terminal back to full
        // size on every resize).
        let baseWidthPx = null;
        function fit() {
          if (baseWidthPx === null) {
            baseWidthPx = screenEl.getBoundingClientRect().width || 1;
          }
          const available = Math.min(availableWidthEl.clientWidth, MAX_WIDTH_PX);
          const scale = Math.min(1, available / baseWidthPx);
          const fontSize = Math.max(6, Math.floor(BASE_FONT_SIZE * scale));
          if (fontSize !== term.options.fontSize) {
            term.options.fontSize = fontSize;
          }
        }
        // One rAF so the initial `term.open()` layout has settled before
        // the first measurement.
        requestAnimationFrame(fit);

        term.onData(handleTerminalData);
        attachPointerInput(screenEl, term);

        let resizeTimer = null;
        window.addEventListener('resize', () => {
          // Debounce: mobile browsers fire resize repeatedly while the
          // on-screen keyboard animates in/out.
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(fit, 100);
        });

        function frame() {
          const ansi = wasm_terminal_example_tick();
          if (ansi) term.write(ansi);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        term.focus();
      }

      main();
    </script>
  </body>
</html>
