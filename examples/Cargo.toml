[package]
name = "retroglyph-examples"
version = "0.1.0-alpha"
description = "Runnable examples for retroglyph (not published)"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The curated facade (retroglyph#1308): everything below reaches through `retroglyph::...` --
# `retroglyph::app`/`backend`/`color`/`event`/... (core's re-exported modules) and
# `retroglyph::crossterm`/`software`/`gl`/`wgpu`/`terminal_wasm`/`ui` (whole-crate re-exports,
# each behind its own feature). `default-features = false` because this crate picks its own
# default (`ui` unconditional below, backends behind this crate's own feature flags) rather than
# inheriting the facade's own `crossterm`+`ui` default.
#
# `ui` is unconditional, like `retroglyph-core` was: widgets is backend-generic (no backend axis
# to gate it on), and every Tier 2 example that uses it (09_widgets_dashboard,
# 10_widgets_interaction) needs it on every backend feature combination this crate builds.
retroglyph = { path = "../crates/retroglyph", version = "0.1.2", default-features = false, features = [
  "ui",
] }
# Needed directly, beyond `retroglyph`'s curated re-exports, for the concrete `Presenter` type
# (examples/tests/support/mod.rs, 17_theme_switch.rs, src/launch.rs) and the `tileset` module's
# `Codepage`/`TilesetOptions` (07_sprites_tileset.rs). Both are deliberately outside the facade's
# curated windowed surface (see crates/retroglyph/src/lib.rs's own comment on that boundary), so
# still reached the same way a real "finer-grained control" consumer would reach them.
retroglyph-window = { path = "../crates/window", version = "0.6.0", optional = true }
# Axial hex coordinates for 20_overworld's strategic hex-tile view: offset<->axial conversion,
# neighbor directions, and hex distance. `no_std`, dependency-free, so it costs nothing on the
# WASM builds.
hexal = "0.1"
# A portable `std::time::Instant`-alike: on non-wasm targets it's a zero-cost re-export of
# `std::time`; on `wasm32-unknown-unknown` it's backed by the browser's `Performance.now()`.
# Already in the workspace's `Cargo.lock` transitively (pulled by `winit`), so this adds no new
# dependency -- it just gives `util/perf.rs` and the `wasm_entry!` FFI tick paths a single,
# non-target-gated `web_time::Instant` instead of each hand-rolling its own native/wasm split.
web-time = "1"

[features]
# An example selects a backend by enabling one of these. With none enabled,
# every example still builds and runs against the Headless backend (used by
# `bin/runner.rs`'s "Headless" option and `launch::<E>()`'s fallback arm).
crossterm = ["retroglyph/crossterm"]
# Pulls in `retroglyph/default-font` unconditionally: unlike the
# library itself (where an optional embedded font matters -- downstream
# users may bring their own bitmap font), there's no example in this gallery
# that benefits from a fontless software backend, so there's nothing to gain
# from splitting that out into a separate flag here. `--features software`
# alone is always enough to run.
# `tilesets` (`retroglyph`'s own forwarding feature, retroglyph#1308) is unconditional here for
# the same reason `default-font` is: only one example (07_sprites_tileset) needs PNG sprite sheet
# loading, but `tools/build-wasm-example.sh` builds this whole crate with one shared `software`
# feature flag per variant, not per example, so there's no cheaper way to give that one example
# the capability without paying for it everywhere `software` is enabled. The cost is
# `image`/`alpha-blend` becoming compile-time (not runtime) dependencies of every software-backend
# build, not a per-example opt-in. `dep:retroglyph-window`/`retroglyph-window/tilesets` bring in
# the `Presenter` type and the `tileset` module's config types those same examples/tests need
# directly (see the dependency's own doc comment above).
software = [
  "retroglyph/software",
  "retroglyph/default-font",
  "retroglyph/tilesets",
  "dep:retroglyph-window",
  "retroglyph-window/tilesets",
]
# The GPU (OpenGL/WebGL2) backend. A windowed backend like `software`, and mutually exclusive with
# it in practice: `launch::<E>()` prefers `software`, then `gl`. Pulls in `default-font`/`tilesets`
# for the same reasons `software` does.
gl = [
  "retroglyph/gl",
  "retroglyph/default-font",
  "retroglyph/tilesets",
  "dep:retroglyph-window",
  "retroglyph-window/tilesets",
]
# The GPU (Vulkan/Metal/D3D12) backend via `wgpu`. A windowed backend like `software`/`gl`, and
# mutually exclusive with both in practice: `launch::<E>()` prefers `software`, then `gl`, then
# this. Pulls in `default-font`/`tilesets` for the same reasons `gl` does.
#
# Builds for `wasm32` too, like `software`/`gl`, rendering through WebGPU. The browser needs WebGPU
# support for it to run; `wgpu-template.html` detects the absence and says so rather than showing a
# blank page.
wgpu = [
  "retroglyph/wgpu",
  "retroglyph/default-font",
  "retroglyph/tilesets",
  "dep:retroglyph-window",
  "retroglyph-window/tilesets",
]
# WASM-only: drives a Terminal<Headless> from a browser requestAnimationFrame
# loop instead of a canvas/window. See `wasm_entry!`'s wasm-headless branch.
# Mutually exclusive with `software` in practice (whichever the example
# binary is built with wins; `launch!`/`wasm_entry!` prefer `software` if
# both are enabled).
wasm-headless = []
# WASM-only: drives a Terminal<TerminalWasm> from a browser terminal emulator
# (e.g. xterm.js -- see docs/templates/examples/terminal-template.html)
# instead of a canvas/window or a plain <pre>. See `wasm_entry!`'s
# wasm-terminal branch. Mutually exclusive with `software`/`wasm-headless` in
# practice (whichever the example binary is built with wins; `launch!`/
# `wasm_entry!` prefer `software`, then `wasm-headless`, then this).
wasm-terminal = ["retroglyph/terminal-wasm"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `--record <path>` (`launch::<E>()`): wraps whichever native, text-oriented backend
# (crossterm, or the headless-stdout fallback) is running in `FrameRecorder`, writing an
# asciicast `.cast` on quit. Not wired into the windowed (software/gl/wgpu) backends -- those
# present pixels, not `DrawCell` text/glyph diffs, and `write_cast`'s ANSI export has nothing
# meaningful to say about a pixel frame. `wasm32` has no filesystem to write a `.cast` to either.
retroglyph-recorder = { path = "../crates/recorder", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
console_error_panic_hook = "0.1"
# DOM access for the FPS overlay's floating toggle button on wasm (see src/fps.rs). Features
# unify with retroglyph-window's own web-sys.
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "EventTarget",
] }

[dev-dependencies]
insta = { version = "1.34", features = ["yaml"] }
# TestHarness (retroglyph#1001): drives an example's Example::tick through the App contract
# against Headless, replacing the hand-rolled push_event/tick/present loop most of
# examples/tests/*.rs used to repeat. Unions with the `[dependencies]` entry above for test
# builds, matching how every other crate here layers a dev-only feature onto its own dependency.
# `default-features = false` here too: a dev-dependency's implicit `default-features = true`
# would otherwise win the union and silently turn `crossterm` back on for every test build.
retroglyph = { path = "../crates/retroglyph", default-features = false, features = ["testing"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# PNG snapshots of the software (headless) renderer's pixel buffer.
image = { version = "0.25", default-features = false, features = ["png"] }
# `examples/tests/support`'s PTY capture (`capture_pty_until`) drives the crossterm binary
# through `retroglyph-recorder`'s `pty::PtySession` (retroglyph#1320) rather than opening a PTY
# and spawning a reader thread itself; `pty` is otherwise unused off the test target, so this is
# a dev-dependency even though the crate is already a normal one above.
retroglyph-recorder = { path = "../crates/recorder", version = "0.1.0", features = ["pty"] }
# `vt100` SVG rendering of the crossterm backend's ANSI output (`svg_snapshot`) -- the PTY capture
# itself goes through `retroglyph-recorder`'s `pty` feature above, which brings in its own copy.
vt100 = "0.16"

[[example]]
name = "01_hello_world"
path = "examples/01_hello_world.rs"

# `examples/tutorial/*.rs`: the book's tutorial (docs/src/tutorial/), not the docs-gallery/
# snapshot-suite examples above. Cargo's default example autodiscovery only covers
# `examples/examples/*.rs` (this crate's default `examples/` dir), so each tutorial chapter
# needs its own `[[example]]` entry to build at all. Deliberately outside
# `tools/build-wasm-examples.sh`'s directory scan and `examples/tests/support`'s 3-snapshot
# harness (see `examples/AGENTS.md`) -- these exist to compile and run headless for the book's
# `{{#include}}` anchors, not to join the WASM gallery.
[[example]]
name = "01_hello"
path = "tutorial/01_hello.rs"

[[example]]
name = "02_input"
path = "tutorial/02_input.rs"

[[example]]
name = "03_a_map"
path = "tutorial/03_a_map.rs"
