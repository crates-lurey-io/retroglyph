[workspace]
semver_check = true

# Per-crate releases (core, the backends, the helper crates) don't individually represent the
# project's public version, so none of them should carry GitHub's repo-wide "Latest" badge. The
# `retroglyph` facade is the exception -- see the [[package]] override below.
git_release_latest = false

git_release_body = """
{{ changelog | replace(from=" by @", to=" by ") }}
"""

# Formerly a `changelog_config = "cliff.toml"` pointer to a standalone git-cliff config; that key
# is deprecated (release-plz's own config only reads a subset of git-cliff's options), so its
# settings live inline here now. release-plz's `[changelog]` schema has no `footer` field on
# `commit_parsers` (see the `changelog: ignore` rule below), so that rule matches on `message`
# instead -- git-cliff matches `message` against the *full* raw commit text, footer lines included,
# so an unanchored regex there sees the same text a `footer` matcher would. `filter_unconventional`,
# `skip_tags`/`ignore_tags`, and `topo_order` have no `[changelog]` equivalent at all and are simply
# dropped; none of them are exercised by this repo's history (PR-title CI already forces every
# commit on main to be conventional, and there are no alpha/beta/rc tags).
[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
<!-- ignore lint rules that are often triggered by content generated from commits / git-cliff -->
<!-- markdownlint-disable line-length no-bare-urls ul-style emphasis-style no-space-in-emphasis no-multiple-blanks -->
"""

body = """
{%- if not version %}
## [unreleased]
{% else -%}
{%- if package -%} {# release-plz specific variable #}
## [{{ version }}+{{ package }}]({{ release_link }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [{{ version }}]({{ self::remote_url() }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- endif %}
{% endif -%}

{% macro commit(commit) -%}
- [{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}) \
  *({{commit.scope | default(value = "uncategorized") | lower }})* {{ commit.message | upper_first | trim }}\
  {% if commit.remote.username %} by `@{{ commit.remote.username }}`{%- endif -%}\
  {% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){%- endif %}\
{%- if commit.breaking %} [**breaking**]{% endif %}
{% endmacro -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") %}
{{ self::commit(commit=commit) }}
{%- endfor -%}
{% for commit in commits %}
{%- if not commit.scope %}
{{ self::commit(commit=commit) }}
{%- endif -%}
{%- endfor -%}
{%- endfor %}

{%- if not release_link -%}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
### New Contributors
{%- endif %}\
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
* `@{{ contributor.username }}` made their first contribution
{%- if contributor.pr_number %} in \
[#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
{%- endif %}
{%- endfor -%}
{%- endif -%}

{% if version %}
{% if previous.version %}
{%- if release_link -%}
**Full Changelog**: {{ release_link }} {# release-plz specific variable #}
{%- else -%}
**Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
{% endif %}
{% endif %}
{% else -%}
  {% raw %}\n{% endraw %}
{% endif %}

{%- macro remote_url() -%}
{%- if remote.owner -%} {# release-plz specific variable #}
https://github.com/{{ remote.owner }}/{{ remote.repo }}\
{%- else -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
{%- endif -%}
{% endmacro %}
"""
trim = false
postprocessors = [
  { pattern = "<!-- Please read CONTRIBUTING.md before submitting any pull request. -->", replace = "" },
  { pattern = '>---+\n', replace = "" },
  { pattern = ' +\n', replace = "\n" },
  { pattern = '\n{3,}', replace = "\n\n" },
]
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
  { field = "id", pattern = "0000000", skip = true },
  { field = "remote.pr_labels", pattern = "skip-changelog", skip = true },
  { message = "(?i)changelog: ?ignore", skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^[fF]ix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^refactor", group = "<!-- 02 -->Refactor" },
  { message = "^doc", group = "<!-- 03 -->Documentation" },
  { message = "^perf", group = "<!-- 04 -->Performance" },
  { message = "^style", group = "<!-- 05 -->Styling" },
  { message = "^test", group = "<!-- 06 -->Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^[cC]hore", group = "<!-- 07 -->Miscellaneous Tasks" },
  { message = "^build\\(deps\\)", skip = true },
  { message = "^build", group = "<!-- 08 -->Build" },
  { body = ".*security", group = "<!-- 09 -->Security" },
  { message = "^ci", group = "<!-- 10 -->Continuous Integration" },
  { message = "^revert", group = "<!-- 11 -->Reverted Commits" },
]
protect_breaking_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"

# `retroglyph`'s version is the project's public version (see #426), so it's the one release that
# should own the "Latest" badge; this restores release-plz's own default for this crate only.
# Note: release-plz can't mark a draft or prerelease as latest, so this stops applying silently if
# the facade ever ships a `-alpha`/`-rc` version.
[[package]]
name = "retroglyph"
git_release_latest = true
